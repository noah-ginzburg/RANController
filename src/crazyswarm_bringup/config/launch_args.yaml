# Default values for the launch arguments.
#
# These are the things you'd otherwise type on the command line, like
# `drone_names:=cf09`. They are NOT node parameters: the launch system consumes
# them before any node exists, which is why they can't live in
# controller_params.yaml or ran_params.yaml. Putting them there does nothing.
#
# Anything here is still overridable on the command line, and the command line
# always wins:
#
#   ros2 launch crazyswarm_bringup real_drone.launch.py drone_names:=cf01
#
# `common` applies to every launch file. The `real` and `sim` sections are then
# layered on top, so a value in one of those overrides `common` for that launch
# file only.
#
# Write values as strings. The launch files compare them as text, so `'true'`
# and `'false'` must be lowercase to match. The one exception is `rviz`, which
# has to be capital-T `'True'` because crazyswarm2 gates on an exact string
# match and would silently never start RViz otherwise.
#
# Not listed here: the paths to controller_params.yaml, ran_params.yaml,
# static_targets.yaml and the RViz configs. Those are computed from the package
# share directory at launch time, and rviz_config_file additionally depends on
# use_static_targets. Pass them on the command line if you need to point
# somewhere else.

common:
  # Which drones to bring up. Comma-separated, e.g. 'cf09' or 'cf01,cf02,cf09'.
  # Whitespace around the commas is stripped, so 'cf01, cf02' is fine.
  #
  # These must match the drones marked `enabled: true` in crazyflies.yaml. A
  # controller for a drone the server doesn't know about waits forever in
  # wait_for_service.
  drone_names: 'cf09'

  # Which of those drones run an attractor network server. Same comma-separated
  # format, and every name here should also appear in drone_names.
  ran_drones: 'cf09'

  # Base height every drone takes off to, in metres. Each drone's delta_z from
  # crazyflies.yaml is added on top of this.
  # 
  # IMPORTANT: a bug was found with crazyflie's launch service that always undershoots the desired launch 
  # height by about 0.06m, IN SIM. This comes from logging the final launch height after
  # crazyflie's service /cfXX/Takeoff is called. The offset was empirically observed.
  # This is important because the drone may not fly perfectly level towards it's targets, therefore 
  # creating a bias. For example, if it flies with a slight negative pitch, it will prefer to choose the 
  # bottom targets because the angular difference between targets is no longer equal. 
  # The current mitigation strategy is to increase this value by 0.06 and tune the simulation
  # hover speed to get the drone flying straight, with 0 pitch, to remove target bias. An attempt at an
  # altitude pid was made, but it made things worse.
  launch_height: '0.5'

  # ---- Targets ---------------------------------------------------------
  #
  # Read this before setting the two below, because the naming is misleading.
  #
  # You do NOT list your targets here. The RAN server treats every entry in
  # `all_drones` except itself as a target, and the launch file builds that
  # list as `drone_names + the enabled targets in static_targets.yaml`. So a
  # drone or static target becomes a target simply by existing.
  #
  # What these two do is override the WEIGHT of a target that is already in
  # that list. They're zipped together positionally into a name -> quality
  # map, and any target not named here just gets `target_quality` from
  # ran_params.yaml (currently 20.0) instead.
  #
  # Format: two comma-separated lists of the same length. Names are strings,
  # qualities are numbers.
  #
  #   target_names:     'cf01,cf02'
  #   target_qualities: '40.0,20.0'
  #
  # would make cf01 twice as attractive as the default and cf02 half as
  # attractive. Leave both empty and every target keeps the default weight.
  #
  # Two things to watch:
  #   - The lists must be the same length or the launch fails with an error
  #     saying so. When use_static_targets is on, the static targets' names and
  #     qualities are appended to both lists, so they stay balanced on their
  #     own -- you only need your own two entries to match each other.
  #   - A name that isn't in drone_names or static_targets.yaml does nothing at
  #     all. It won't error, it just never gets looked up.
  # 
  # Additionally, changing drone target positions requires you to go into crazyflies.yaml in the crazyswarm2 package
  # and enable/set the initial position of all of the drones. The drone positions will be set in sim, 
  # but the vicon should override their positions in real life after vicon_bridge.py 
  # manually publishes their tf transforms. You must set 'enabled = true' for the drones in the list to be picked up
  # by ROS. For static targets, same idea, but in static_targes.yaml in the config folder of this package
  target_names: ''
  target_qualities: ''

  # Use the invisible draggable markers from config/static_targets.yaml instead
  # of real target drones. Recommended over flying real targets.
  use_static_targets: 'true'

  # Optional override of the `quality` values in static_targets.yaml, applied
  # positionally in the order the targets appear in that file. Comma-separated,
  # same as above. A single value covers every target, and empty keeps whatever
  # the file itself says.
  #
  #   static_target_qualities: '25.0'            # all targets -> 25.0
  #   static_target_qualities: '40.0,20.0,20.0'  # per target, in file order
  static_target_qualities: '20.0'

  # Take off as soon as the controller starts, instead of waiting for a takeoff
  # command from the debug GUI. Genuinely independent of `teleop` now -- the
  # real launch file used to override this default to 'false' whenever teleop
  # was on, which made the comment true on paper and false in practice.
  auto_launch: 'true'

  # Whether the RAN server publishes <drone>/desired_heading, i.e. whether the
  # attractor model actually flies the drone.
  #
  # This is the half of the old `teleop` flag that had nothing to do with the
  # keyboard. `teleop` used to open the teleop window AND silence the model,
  # so the two were mutually exclusive for no reason other than being wired to
  # the same argument. They're separate now and every combination is legal:
  #
  #   ran_enabled:='true'  teleop:='false'  model flies it (the normal case)
  #   ran_enabled:='true'  teleop:='true'   model flies it, keyboard overrides
  #                                         for teleop_timeout seconds per
  #                                         keypress, then the model resumes
  #   ran_enabled:='false' teleop:='true'   pure manual flight
  #   ran_enabled:='false' teleop:='false'  nothing commands it; GoTo and Land
  #                                         from the debug GUI are all it does
  #
  # 'false' does NOT stop the model. It keeps integrating and keeps drawing
  # itself in RViz, so you can watch a bump form and settle while flying the
  # drone some other way, and hand control back without waiting for the network
  # to re-converge. Only the publish is held back.
  #
  # This is the STARTING state. The debug GUI has a "RAN Publisher" button that
  # toggles it live on <drone>/ran_enabled, so you don't have to relaunch to
  # take the model in or out of the loop mid-flight.
  ran_enabled: 'true'

#Real flight launch params
real:
  #do not touch this line
  real: 'true' #switches the cf server backend to cflib (proper one for connecting to drone) instead of sim backend

  # Record a rosbag to bags/flight_<timestamp>/.
  record: 'true'

  # Capital T on purpose -- see the note at the top of this file.
  rviz: 'True'

  # Manual keyboard flight. teleop:='true' opens a teleop_twist_keyboard
  # window, and that is now the ONLY thing it does.
  #
  # It used to also force auto_launch off and silence the RAN server. Those are
  # `auto_launch` and `ran_enabled` in the common section above; set them
  # yourself if you want them. Note in particular that the auto-takeoff is no
  # longer suppressed for you, so if you want to command the takeoff from the
  # debug GUI -- which you usually do under teleop, since /cmd_vel can only
  # steer a drone that is already airborne -- keep auto_launch at 'false'.
  #
  # NOTE: unrelated to the `teleop` argument real_drone.launch.py passes into
  # crazyswarm2's own launch.py, which is its gamepad stack and stays off.
  teleop: 'true'

  # teleop_twist_keyboard's own speed and turn rate, used only when
  # teleop:='true'. Its stock speed of 0.5 m/s is brisk for a Crazyflie
  # indoors, so this matches max_speed in controller_params.yaml instead.
  teleop_speed: '0.2'
  teleop_turn: '0.5'

  # Sourced inside the teleop terminal. gnome-terminal is sometimes
  # dbus-activated, and when it is, the new window doesn't inherit this
  # process's environment.
  ws_setup: '~/biodrone/install/setup.bash'

  # On Ctrl+C, launch sends SIGINT, then SIGTERM after sigterm_timeout, then an
  # uncatchable SIGKILL sigkill_timeout later.
  #
  # sigterm_timeout MUST stay above the controller's land_duration (5 s in
  # controller_params.yaml). SIGINT starts the landing, and both
  # crazyflie_server and vicon_bridge have to survive the whole descent or the
  # drone lands with no mocap and no radio link. 7 + 2 means everything is
  # dead about 9 s after Ctrl+C.
  #
  # crazyflie_server also ignores SIGINT entirely, so with launch's 5/10
  # defaults it lingers about 10 s and reappears as a duplicate.
  sigterm_timeout: '7'
  sigkill_timeout: '2'

sim:
  #do not touch this line - this switches the crazyflie backend to its sim backend
  real: 'false'

  # IMPORTANT: a bug was found with crazyflie's physics in simulation, where it slowly falls due to gravity over time.
  # I believe it is dependent on the simulation clock speed. This is the last value that got it relatively stable (not drifting
  # up or down). This can affect whether the drone flies straight or not to the targets, and if it flies with a positive/
  # negative pitch, it can introduce a bias becaues the angular difference between targets is no longer equal.
  hover_speed_sim: '0.170'

  # The sim workflow is built around the static targets, so they're on here.
  use_static_targets: 'true'

  # Nothing has to survive a landing in sim, so the shutdown window can be
  # short.
  sigterm_timeout: '2'
  sigkill_timeout: '2'

  # There is still no teleop MODE in sim: sim_drone.launch.py declares no
  # `teleop` argument and opens no keyboard window, so the value here does
  # nothing. Listed only so that is obvious.
  #
  # You can still fly sim from the keyboard -- the controller subscribes to
  # /cmd_vel either way, so just start teleop_twist_keyboard yourself. Pair it
  # with auto_launch:='false' if you don't want the drone climbing on its own
  # first.
  #
  # `ran_enabled` from the common section DOES apply here, and sim honours it
  # properly now; it used to be pinned on because it was derived from this
  # dead argument.
  teleop: 'true'
